name: Badge count

# Keeps the README skills badge and catalog prose in sync with the number of
# skill directories containing a SKILL.md. Event-driven (push to main touches
# skills/** or README.md), not scheduled: the count only changes via merges.
# The bot's own commit carries [skip ci], so GitHub natively skips the
# re-triggered run.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'README.md'
      - '.github/workflows/badge-count.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: badge-count
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agents hub
        uses: actions/checkout@v5

      - name: Update skills count if drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          COUNT=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          BADGE_OLD=$(grep -o 'Skills: [0-9]*' README.md | head -1 | awk '{print $2}')
          PROSE_OLD=$(grep -o 'catalog of [0-9]* skills' README.md | head -1 | awk '{print $3}')
          echo "count=$COUNT badge=$BADGE_OLD prose=$PROSE_OLD"
          if [ "$BADGE_OLD" = "$COUNT" ] && [ "$PROSE_OLD" = "$COUNT" ]; then
            echo "Badge and catalog prose already match the on-disk count"
            exit 0
          fi
          sed -i.bak -E "s/!\[Skills: [0-9]+\]/![Skills: $COUNT]/; s#badge/skills-[0-9]+-#badge/skills-$COUNT-#" README.md
          sed -i.bak -E "s/catalog of [0-9]+ skills/catalog of $COUNT skills/" README.md
          rm README.md.bak
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to change after rewrite"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No [skip ci] here: skip-ci in the head commit message suppresses
          # pull_request events too, which would stop auto-merge-docs from
          # merging this PR. A loop is impossible anyway — the runner no-ops
          # when the counts match, so its own push can never re-drift.
          git commit -m "chore(badge): skills count ${PROSE_OLD}/${BADGE_OLD} -> ${COUNT}"
          # main is PR-protected: try a direct push first (same pattern as
          # sync-upstream), fall back to the fixed branch + PR when rejected.
          if git push origin HEAD:main 2>/dev/null; then
            echo "Pushed badge correction directly to main: $COUNT"
            exit 0
          fi
          BRANCH="chore/badge-count"
          git push -f origin HEAD:"refs/heads/$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --title "chore(badge): skills count ${PROSE_OLD}/${BADGE_OLD} -> ${COUNT}" \
              --body "Automated README badge/catalog count correction by the badge-count workflow (refreshed by latest run: ${GITHUB_RUN_ID})."
            echo "Updated existing PR for $BRANCH"
            exit 0
          fi
          if gh pr create \
            --title "chore(badge): skills count ${PROSE_OLD}/${BADGE_OLD} -> ${COUNT}" \
            --body "Automated README badge/catalog count correction by the badge-count workflow.

          Count rule: directories under skills/ containing a SKILL.md.

          🤖 Generated by ZCode - GLM-5.3-Flash" \
            --base main --head "$BRANCH"; then
            echo "Opened PR for badge correction: $COUNT"
            exit 0
          fi
          echo "::error::gh pr create failed. Enable Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests, or open it manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
          exit 1
