# Upstream sources for sync-upstream workflow
#
# Maps remote repos + paths to local directories.
# To add a new source, add an entry here and re-run the workflow.
# Entries sync the upstream default branch unless an optional `ref:` pins a
# branch or tag. Provenance lives in .upstream-manifest.json (repo HEAD and,
# per entry, `source_commit`: the last commit that touched the synced source).
#
# Sync history is tracked via git log:
#   git log -- skills/<name>/
#   git log -- recipes/<name>/

skills:
  # dataviz has no git upstream - it ships bundled inside the Claude Code CLI
  # binary (Anthropic proprietary; see skills/dataviz/PROVENANCE.md). To
  # refresh: invoke /dataviz once on the new CLI, diff the extraction under
  # /tmp/claude-<uid>/bundled-skills/<version>/<hash>/dataviz/ (hash churns per
  # version) against skills/dataviz/, then capture the SKILL.md body by
  # invoking the skill (the loader strips frontmatter) and re-attach it.
  - name: frontend-design
    repo: anthropics/claude-plugins-official
    # Inner flat skill folder — never the plugin wrapper (see the skill's PROVENANCE.md)
    path: plugins/frontend-design/skills/frontend-design
    preserve: [PROVENANCE.md]
  - name: marp-slide
    repo: softaworks/agent-toolkit
    path: skills/marp-slide
    preserve: [PROVENANCE.md]
  - name: caveman
    repo: JuliusBrussee/caveman
    # Inner flat skill folder in the plugin wrapper — never the wrapper itself
    # (see the skill's PROVENANCE.md)
    path: plugins/caveman/skills/caveman
    preserve: [PROVENANCE.md]
  - name: security-audit
    repo: cloudflare/security-audit-skill
    path: skills/security-audit
    # Localizations preserved across syncs; upstream-only files never copied.
    preserve: [PROVENANCE.md, LICENSE]
    exclude: ["*.test.cjs"]
  - name: html-reel
    repo: MengTo/Skills
    path: agent-skills/media/html-reel
    preserve: [PROVENANCE.md, LICENSE]
  - name: herdr
    repo: herdrdev/herdr
    path: skills/herdr
    preserve: [PROVENANCE.md]

recipes:
  - name: twilio-voice-brain.md
    repo: garrytan/gbrain
    path: recipes
    file: twilio-voice-brain.md
    # Deprecated + frozen upstream (2026-05-23, successor: agent-voice).
    # Kept as a redirect for existing Twilio installs. Stop tracking when
    # upstream deletes the file, then archive our copy (see recipes/PROVENANCE.md).
  - name: agent-voice.md
    repo: garrytan/gbrain
    path: recipes
    file: agent-voice.md
  - name: ngrok-tunnel.md
    repo: garrytan/gbrain
    path: recipes
    file: ngrok-tunnel.md
